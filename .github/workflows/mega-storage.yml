name: iKiraPlus MEGA Storage
run-name: "MEGA • ${{ github.event.client_payload.shortId }}"

on:
  repository_dispatch:
    types: [ikiraplus_mega]

permissions:
  contents: read

concurrency:
  group: mega-${{ github.event.client_payload.shortId }}
  cancel-in-progress: false

jobs:
  mega-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      RCLONE_CONFIG_MEGA_TYPE: mega
      RCLONE_CONFIG_MEGA_USER: ${{ secrets.MEGA_EMAIL }}
      RCLONE_CONFIG_MEGA_2FA: ${{ secrets.MEGA_2FA }}
    steps:
      - name: Checkout public ipa repository
        uses: actions/checkout@v4

      - name: Install verified current rclone v1.75.2
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu apt packaged v1.60.1-DEV in prior run; use a pinned official release.
          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip" \
            -o /tmp/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  /tmp/rclone-v1.75.2-linux-amd64.zip" \
            | sha256sum -c -
          unzip -qq /tmp/rclone-v1.75.2-linux-amd64.zip \
            "rclone-v1.75.2-linux-amd64/rclone" -d /tmp/
          sudo install -m 0755 /tmp/rclone-v1.75.2-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: Convert MEGA password for rclone (without logging password)
        shell: bash
        env:
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MEGA_PASSWORD:-}" ]]; then
            echo "::error::Missing Actions secret MEGA_PASSWORD"
            exit 1
          fi
          # rclone obscure - reads password from stdin, not process args.
          # Never print the raw or obscured password into job logs.
          obscured="$(printf '%s\n' "$MEGA_PASSWORD" | rclone obscure -)"
          if [[ -z "$obscured" ]]; then
            echo "::error::rclone failed to obscure password"
            exit 1
          fi
          echo "::add-mask::$obscured"
          printf 'RCLONE_CONFIG_MEGA_PASS=%s\n' "$obscured" >> "$GITHUB_ENV"
          unset MEGA_PASSWORD obscured

      - name: Transfer external IPA to MEGA
        shell: bash
        run: python3 scripts/mega_storage_transfer.py
