name: iKiraPlus Admin Queue Kick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-queue-kick.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch admin queue runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d '{"event_type":"ikiraplus_admin_mutate","client_payload":{"requestId":"queue-kick"}}'
