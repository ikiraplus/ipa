name: iKiraPlus Storage Public Runner
run-name: "iKiraPlus storage • ${{ github.event.client_payload.shortId }}"

on:
  repository_dispatch:
    types: [ikiraplus_storage]

permissions:
  contents: read

jobs:
  mirror-to-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TARGET_REPO: ikiraplus/ipastore
      PRIVATE_ENGINE_REF: be0b867c1afeba2bc03857af8c756524d4c10698
      IKIRAPLUS_STORAGE_BRIDGE_TOKEN: ${{ secrets.IKIRAPLUS_STORAGE_BRIDGE_TOKEN }}

    steps:
      - name: Validate storage bridge token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IKIRAPLUS_STORAGE_BRIDGE_TOKEN:-}" || {
            echo "Missing repository secret: IKIRAPLUS_STORAGE_BRIDGE_TOKEN"
            exit 1
          }

      - name: Fetch private storage engine
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/ikiraplus-storage-private.yml"
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            -H "Authorization: Bearer $IKIRAPLUS_STORAGE_BRIDGE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPO/contents/.github/workflows/ikiraplus-storage.yml?ref=$PRIVATE_ENGINE_REF" \
            | jq -r '.content' | tr -d '\n' | base64 -d > "$ENGINE"
          test -s "$ENGINE"

      - name: Run private storage engine on public runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          import yaml

          engine_path = os.path.join(os.environ["RUNNER_TEMP"], "ikiraplus-storage-private.yml")
          with open(engine_path, "r", encoding="utf-8") as fh:
              workflow = yaml.safe_load(fh)

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          payload = event.get("client_payload") or {}
          source_url = str(payload.get("sourceUrl") or "").strip()
          original_url = str(payload.get("originalUrl") or source_url).strip()

          runtime_env = {
              "PROXY_URL": source_url,
              "ORIGINAL_URL": original_url,
              "ASSET_NAME": str(payload.get("assetName") or "").strip(),
              "SHORT_ID": str(payload.get("shortId") or "").strip(),
              "CALLBACK_URL": str(payload.get("callbackUrl") or "").strip(),
              "CALLBACK_START_URL": str(payload.get("callbackStartUrl") or "").strip(),
              "CALLBACK_FAIL_URL": str(payload.get("callbackFailUrl") or "").strip(),
              "CALLBACK_PROGRESS_URL": str(payload.get("callbackProgressUrl") or "").strip(),
              "CALLBACK_TOKEN": str(payload.get("callbackToken") or "").strip(),
              "EXPECTED_SIZE": str(payload.get("expectedSize") or "").strip(),
          }

          # These values must never be printed in this public repository's logs.
          # GitHub masks them if any child command accidentally emits them later.
          for value in (
              runtime_env["PROXY_URL"],
              runtime_env["ORIGINAL_URL"],
              runtime_env["CALLBACK_URL"],
              runtime_env["CALLBACK_START_URL"],
              runtime_env["CALLBACK_FAIL_URL"],
              runtime_env["CALLBACK_PROGRESS_URL"],
              runtime_env["CALLBACK_TOKEN"],
          ):
              if value:
                  print(f"::add-mask::{value}", flush=True)

          # Mask hostnames separately: redirects and alternate URLs may not
          # match the original full-URL mask.
          from urllib.parse import urlsplit
          for value in (source_url, original_url):
              try:
                  parsed = urlsplit(value)
                  if parsed.hostname:
                      print(f"::add-mask::{parsed.hostname}", flush=True)
                  if parsed.netloc and parsed.netloc != parsed.hostname:
                      print(f"::add-mask::{parsed.netloc}", flush=True)
              except (TypeError, ValueError):
                  pass

          steps = workflow["jobs"]["mirror-to-release"]["steps"]
          by_name = {step.get("name"): step for step in steps if step.get("name")}

          runner_repo = os.environ["GITHUB_REPOSITORY"]
          target_repo = os.environ["TARGET_REPO"]
          token = os.environ.get("IKIRAPLUS_STORAGE_BRIDGE_TOKEN", "")

          required = [
              "Report started to Worker",
              "Validate request",
              "Download and validate real file",
              "Upload to first available storage release",
              "Verify uploaded asset size",
              "Make GitHub the primary DL source immediately",
          ]
          missing = [name for name in required if name not in by_name]
          if missing:
              raise SystemExit("Private storage workflow changed; missing steps: " + ", ".join(missing))

          def run_step(name, *, target=False, extra_env=None):
              script = by_name[name].get("run")
              if not script:
                  raise RuntimeError(f"Step has no run script: {name}")

              env = os.environ.copy()
              env.update(runtime_env)
              env["GH_TOKEN"] = token
              env["GITHUB_REPOSITORY"] = target_repo if target else runner_repo
              if extra_env:
                  env.update(extra_env)

              fd, output_path = tempfile.mkstemp(prefix="ikiraplus-output-")
              os.close(fd)
              env["GITHUB_OUTPUT"] = output_path

              print(f"::group::{name}", flush=True)
              try:
                  # Keep the private engine script out of process arguments and public tracebacks.
                  # bash -s receives exactly the same shell script through stdin.
                  subprocess.run(["bash", "-s"], input=script, text=True, env=env, check=True)
              finally:
                  print("::endgroup::", flush=True)

              outputs = {}
              try:
                  with open(output_path, "r", encoding="utf-8") as fh:
                      for raw in fh:
                          line = raw.rstrip("\n")
                          if "=" in line:
                              key, value = line.split("=", 1)
                              outputs[key] = value
              finally:
                  try:
                      os.unlink(output_path)
                  except OSError:
                      pass
              return outputs


          def original_file_identity():
              # Re-open the exact file that the private uploader will stream.
              # No ZIP rewriting, repacking, or compression is permitted.
              import hashlib
              path = os.path.join(os.environ["RUNNER_TEMP"], "ikiraplus-storage", runtime_env["ASSET_NAME"])
              if not os.path.isfile(path):
                  raise RuntimeError("Original downloaded asset not found")
              size = os.path.getsize(path)
              if size <= 0:
                  raise RuntimeError("Original downloaded asset is empty")
              declared = str(runtime_env["EXPECTED_SIZE"] or "").strip()
              if declared:
                  try:
                      expected = int(float(declared))
                  except (TypeError, ValueError, OverflowError):
                      raise RuntimeError("Invalid original size metadata")
                  if expected > 0 and expected != size:
                      raise RuntimeError("Original file size differs from the source metadata")
              digest = hashlib.sha256()
              with open(path, "rb") as source:
                  while True:
                      chunk = source.read(4 * 1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
              return size, digest.hexdigest()

          run_step("Report started to Worker")
          run_step("Validate request")
          run_step("Download and validate real file")
          original_size, original_sha256 = original_file_identity()
          print("Original file verified; archive compression and repacking disabled.", flush=True)

          upload_outputs = run_step("Upload to first available storage release", target=True)
          storage_tag = upload_outputs.get("tag", "").strip()
          if not storage_tag:
              raise RuntimeError("Storage upload completed without a storage tag output")

          run_step(
              "Verify uploaded asset size",
              target=True,
              extra_env={"STORAGE_TAG": storage_tag},
          )
          final_size, final_sha256 = original_file_identity()
          if final_size != original_size or final_sha256 != original_sha256:
              raise RuntimeError("Local IPA bytes changed between download and upload")
          print("Original SHA-256 and byte count unchanged after upload.", flush=True)

          run_step(
              "Make GitHub the primary DL source immediately",
              extra_env={"STORAGE_TAG": storage_tag},
          )
          PY

      - name: Report failure to Worker
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set +e
          SHORT_ID="$(jq -r '.client_payload.shortId // empty' "$GITHUB_EVENT_PATH")"
          CALLBACK_FAIL_URL="$(jq -r '.client_payload.callbackFailUrl // empty' "$GITHUB_EVENT_PATH")"
          CALLBACK_TOKEN="$(jq -r '.client_payload.callbackToken // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$CALLBACK_FAIL_URL" ] || [ -z "$CALLBACK_TOKEN" ] || [ -z "$SHORT_ID" ]; then exit 0; fi
          echo "::add-mask::$CALLBACK_FAIL_URL"
          echo "::add-mask::$CALLBACK_TOKEN"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg id "$SHORT_ID" \
            --arg token "$CALLBACK_TOKEN" \
            --arg message "iKiraPlus Storage Backup failed — افتح GitHub Action للتفاصيل" \
            --arg conclusion "failure" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg runUrl "$RUN_URL" \
            '{id:$id,token:$token,message:$message,conclusion:$conclusion,runId:$runId,runUrl:$runUrl}')"
          curl --silent --show-error --retry 8 --retry-delay 1 --retry-all-errors \
            --header "Content-Type: application/json" --data "$payload" "$CALLBACK_FAIL_URL" || true
