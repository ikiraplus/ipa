name: iKiraPlus Storage Public Runner
run-name: "iKiraPlus storage • ${{ github.event.client_payload.shortId }}"

on:
  repository_dispatch:
    types: [ikiraplus_storage]

permissions:
  contents: read

jobs:
  mirror-to-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TARGET_REPO: ikiraplus/ipastore
      PRIVATE_ENGINE_REF: be0b867c1afeba2bc03857af8c756524d4c10698
      IKIRAPLUS_STORAGE_BRIDGE_TOKEN: ${{ secrets.IKIRAPLUS_STORAGE_BRIDGE_TOKEN }}

    steps:
      - name: Validate storage bridge token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IKIRAPLUS_STORAGE_BRIDGE_TOKEN:-}" || {
            echo "Missing repository secret: IKIRAPLUS_STORAGE_BRIDGE_TOKEN"
            exit 1
          }

      - name: Fetch private storage engine
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/ikiraplus-storage-private.yml"
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            -H "Authorization: Bearer $IKIRAPLUS_STORAGE_BRIDGE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPO/contents/.github/workflows/ikiraplus-storage.yml?ref=$PRIVATE_ENGINE_REF" \
            | jq -r '.content' | tr -d '\n' | base64 -d > "$ENGINE"
          test -s "$ENGINE"

      - name: Run private storage engine on public runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          import time
          import yaml

          engine_path = os.path.join(os.environ["RUNNER_TEMP"], "ikiraplus-storage-private.yml")
          with open(engine_path, "r", encoding="utf-8") as fh:
              workflow = yaml.safe_load(fh)

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          payload = event.get("client_payload") or {}
          source_url = str(payload.get("sourceUrl") or "").strip()
          original_url = str(payload.get("originalUrl") or source_url).strip()

          runtime_env = {
              "PROXY_URL": source_url,
              "ORIGINAL_URL": original_url,
              "ASSET_NAME": str(payload.get("assetName") or "").strip(),
              "SHORT_ID": str(payload.get("shortId") or "").strip(),
              "CALLBACK_URL": str(payload.get("callbackUrl") or "").strip(),
              "CALLBACK_START_URL": str(payload.get("callbackStartUrl") or "").strip(),
              "CALLBACK_FAIL_URL": str(payload.get("callbackFailUrl") or "").strip(),
              "CALLBACK_PROGRESS_URL": str(payload.get("callbackProgressUrl") or "").strip(),
              "CALLBACK_TOKEN": str(payload.get("callbackToken") or "").strip(),
              "EXPECTED_SIZE": str(payload.get("expectedSize") or "").strip(),
          }

          # These values must never be printed in this public repository's logs.
          # GitHub masks them if any child command accidentally emits them later.
          for value in (
              runtime_env["PROXY_URL"],
              runtime_env["ORIGINAL_URL"],
              runtime_env["CALLBACK_URL"],
              runtime_env["CALLBACK_START_URL"],
              runtime_env["CALLBACK_FAIL_URL"],
              runtime_env["CALLBACK_PROGRESS_URL"],
              runtime_env["CALLBACK_TOKEN"],
          ):
              if value:
                  print(f"::add-mask::{value}", flush=True)

          steps = workflow["jobs"]["mirror-to-release"]["steps"]
          by_name = {step.get("name"): step for step in steps if step.get("name")}

          runner_repo = os.environ["GITHUB_REPOSITORY"]
          target_repo = os.environ["TARGET_REPO"]
          token = os.environ.get("IKIRAPLUS_STORAGE_BRIDGE_TOKEN", "")

          required = [
              "Report started to Worker",
              "Validate request",
              "Download and validate real file",
              "Upload to first available storage release",
              "Verify uploaded asset size",
              "Make GitHub the primary DL source immediately",
          ]
          missing = [name for name in required if name not in by_name]
          if missing:
              raise SystemExit("Private storage workflow changed; missing steps: " + ", ".join(missing))

          def run_step(name, *, target=False, extra_env=None):
              script = by_name[name].get("run")
              if not script:
                  raise RuntimeError(f"Step has no run script: {name}")

              env = os.environ.copy()
              env.update(runtime_env)
              env["GH_TOKEN"] = token
              env["GITHUB_REPOSITORY"] = target_repo if target else runner_repo
              if extra_env:
                  env.update(extra_env)

              fd, output_path = tempfile.mkstemp(prefix="ikiraplus-output-")
              os.close(fd)
              env["GITHUB_OUTPUT"] = output_path

              print(f"::group::{name}", flush=True)
              try:
                  # Keep the private engine script out of process arguments and public tracebacks.
                  # bash -s receives exactly the same shell script through stdin.
                  subprocess.run(["bash", "-s"], input=script, text=True, env=env, check=True)
              finally:
                  print("::endgroup::", flush=True)

              outputs = {}
              try:
                  with open(output_path, "r", encoding="utf-8") as fh:
                      for raw in fh:
                          line = raw.rstrip("\n")
                          if "=" in line:
                              key, value = line.split("=", 1)
                              outputs[key] = value
              finally:
                  try:
                      os.unlink(output_path)
                  except OSError:
                      pass
              return outputs


          def optimize_local_archive(outputs, started):
              # The upload engine keeps its downloaded asset on this runner.
              # Optimize only a uniquely identified IPA; otherwise preserve the original.
              import copy
              import struct
              import zipfile

              def roots():
                  values = [os.getcwd(), os.environ.get("GITHUB_WORKSPACE"), os.environ.get("RUNNER_TEMP"), tempfile.gettempdir()]
                  return list(dict.fromkeys(os.path.realpath(v) for v in values if v and os.path.isdir(v)))

              def eligible(path):
                  try:
                      if os.path.islink(path) or not os.path.isfile(path):
                          return False
                      st = os.stat(path)
                      if st.st_mtime < started - 30 or not 262144 <= st.st_size < 2 * 1024 ** 3:
                          return False
                      with open(path, "rb") as fd:
                          if fd.read(2) != b"PK":
                              return False
                      with zipfile.ZipFile(path, "r") as archive:
                          return any(name.startswith("Payload/") and ".app/" in name for name in archive.namelist())
                  except (OSError, ValueError, zipfile.BadZipFile, RuntimeError):
                      return False

              paths = set()
              # Output paths from the download step take priority even outside standard runner directories.
              for key, value in outputs.items():
                  if "path" in key.lower() or "file" in key.lower():
                      value = str(value or "")
                      if value and os.path.isfile(os.path.expanduser(value)):
                          paths.add(os.path.realpath(os.path.expanduser(value)))
              for root in roots():
                  for folder, directories, filenames in os.walk(root, followlinks=False):
                      depth = os.path.relpath(folder, root).count(os.sep)
                      if depth >= 7:
                          directories[:] = []
                      else:
                          directories[:] = [d for d in directories if d not in (".git", "node_modules", ".cache", ".venv", "site-packages")]
                      for filename in filenames:
                          path = os.path.join(folder, filename)
                          try:
                              if os.stat(path).st_mtime >= started - 30:
                                  paths.add(os.path.realpath(path))
                          except OSError:
                              pass

              candidates = sorted(p for p in paths if eligible(p))
              selected = None
              if len(candidates) == 1:
                  selected = candidates[0]
              elif len(candidates) > 1:
                  hints = []
                  for key, value in outputs.items():
                      if "path" in key.lower() or "file" in key.lower():
                          hint = os.path.realpath(os.path.expanduser(str(value)))
                          if hint in candidates:
                              hints.append(hint)
                  named = [p for p in candidates if os.path.basename(p) == runtime_env["ASSET_NAME"]]
                  matches = list(dict.fromkeys(hints or named))
                  if len(matches) == 1:
                      selected = matches[0]

              if not selected:
                  print("Archive optimization skipped; original upload path retained.", flush=True)
                  return

              def without_zip64(extra):
                  # Old ZIP64 size fields must not be duplicated during repacking.
                  result = bytearray()
                  offset = 0
                  while offset < len(extra):
                      if offset + 4 > len(extra):
                          raise ValueError("Invalid ZIP extra field")
                      tag, length = struct.unpack_from("<HH", extra, offset)
                      end = offset + 4 + length
                      if end > len(extra):
                          raise ValueError("Invalid ZIP extra field size")
                      if tag != 0x0001:
                          result.extend(extra[offset:end])
                      offset = end
                  return bytes(result)

              temporary = None
              original_size = os.path.getsize(selected)
              deadline = time.monotonic() + 12 * 60
              try:
                  fd, temporary = tempfile.mkstemp(prefix=".ipa-optimized-", suffix=".tmp", dir=os.path.dirname(selected))
                  os.close(fd)
                  with zipfile.ZipFile(selected, "r") as source, zipfile.ZipFile(temporary, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as target:
                      entries = source.infolist()
                      if not entries or len(entries) > 100000:
                          raise ValueError("Unexpected archive entry count")
                      target.comment = source.comment
                      for entry in entries:
                          if time.monotonic() > deadline:
                              raise TimeoutError("Archive optimization limit exceeded")
                          metadata = copy.copy(entry)
                          metadata.extra = without_zip64(entry.extra)
                          metadata.compress_type = zipfile.ZIP_STORED if entry.is_dir() else zipfile.ZIP_DEFLATED
                          if entry.is_dir():
                              target.writestr(metadata, b"")
                          else:
                              with source.open(entry, "r") as reader, target.open(metadata, "w") as writer:
                                  while True:
                                      chunk = reader.read(2 * 1024 * 1024)
                                      if not chunk:
                                          break
                                      writer.write(chunk)
                                      if time.monotonic() > deadline:
                                          raise TimeoutError("Archive optimization limit exceeded")
                  optimized_size = os.path.getsize(temporary)
                  if optimized_size >= original_size:
                      print("Archive optimization provided no savings; original retained.", flush=True)
                      return

                  # Verify member order, names, sizes, CRCs and every uncompressed byte.
                  with zipfile.ZipFile(selected, "r") as source, zipfile.ZipFile(temporary, "r") as target:
                      before = source.infolist()
                      after = target.infolist()
                      if len(before) != len(after) or source.comment != target.comment:
                          raise ValueError("Archive comparison failed")
                      for a, b in zip(before, after):
                          if (a.filename, a.file_size, a.CRC) != (b.filename, b.file_size, b.CRC):
                              raise ValueError("Archive integrity mismatch")
                          with target.open(b, "r") as reader:
                              while reader.read(2 * 1024 * 1024):
                                  if time.monotonic() > deadline:
                                      raise TimeoutError("Archive verification limit exceeded")

                  os.replace(temporary, selected)
                  temporary = None
                  runtime_env["EXPECTED_SIZE"] = str(optimized_size)
                  print("Smaller verified IPA selected for upload.", flush=True)
              except Exception:
                  # An optimization error must never fail the normal upload.
                  print("Archive optimization failed; original retained for upload.", flush=True)
              finally:
                  if temporary:
                      try:
                          os.unlink(temporary)
                      except OSError:
                          pass

          run_step("Report started to Worker")
          run_step("Validate request")

          download_started = time.time()
          download_outputs = run_step("Download and validate real file")
          try:
              optimize_local_archive(download_outputs, download_started)
          except Exception:
              # Even discovery/inspection errors must not interrupt the upload.
              print("Archive optimization unavailable; original retained for upload.", flush=True)

          upload_outputs = run_step("Upload to first available storage release", target=True)
          storage_tag = upload_outputs.get("tag", "").strip()
          if not storage_tag:
              raise RuntimeError("Storage upload completed without a storage tag output")

          run_step(
              "Verify uploaded asset size",
              target=True,
              extra_env={"STORAGE_TAG": storage_tag},
          )

          run_step(
              "Make GitHub the primary DL source immediately",
              extra_env={"STORAGE_TAG": storage_tag},
          )
          PY

      - name: Report failure to Worker
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set +e
          SHORT_ID="$(jq -r '.client_payload.shortId // empty' "$GITHUB_EVENT_PATH")"
          CALLBACK_FAIL_URL="$(jq -r '.client_payload.callbackFailUrl // empty' "$GITHUB_EVENT_PATH")"
          CALLBACK_TOKEN="$(jq -r '.client_payload.callbackToken // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$CALLBACK_FAIL_URL" ] || [ -z "$CALLBACK_TOKEN" ] || [ -z "$SHORT_ID" ]; then exit 0; fi
          echo "::add-mask::$CALLBACK_FAIL_URL"
          echo "::add-mask::$CALLBACK_TOKEN"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n \
            --arg id "$SHORT_ID" \
            --arg token "$CALLBACK_TOKEN" \
            --arg message "iKiraPlus Storage Backup failed — افتح GitHub Action للتفاصيل" \
            --arg conclusion "failure" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg runUrl "$RUN_URL" \
            '{id:$id,token:$token,message:$message,conclusion:$conclusion,runId:$runId,runUrl:$runUrl}')"
          curl --silent --show-error --retry 8 --retry-delay 1 --retry-all-errors \
            --header "Content-Type: application/json" --data "$payload" "$CALLBACK_FAIL_URL" || true
